<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA MUNICIPAL / Nueva Contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-box h2 { margin-top: 0; color: #333; font-size: 1.2em; }
        .login-box h3 { color: #333; margin-bottom: 5px; }
        .step { color: #B30000; font-weight: bold; font-size: 14px; margin-bottom: 15px; display: block;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px;}
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-guardar { background-color: #B30000; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 15px; margin-top: 10px;}
        .btn-guardar:hover { background-color: #8B0000; }
        .requisitos { font-size: 12px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Gestión de Atención Ciudadana</h2>
        <h3>Crear nueva contraseña</h3>
        <span class="step">Paso 3 de 3 · Nueva clave</span>
        
        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label>Nueva contraseña</label>
                <input type="password" name="new_password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Confirmar nueva contraseña</label>
                <input type="password" name="confirm_password" placeholder="••••••••" required>
            </div>
            
            <p class="requisitos">Requisitos visibles y coincidencia de ambas claves.</p>
            
            <button type="submit" class="btn-guardar">Guardar contraseña</button>
        </form>
        
        <p style="font-size: 12px; color: #666; text-align: center;">Al guardar, podrás ingresar con tu nueva contraseña.</p>
    </div>

</body>
</html>
