<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA MUNICIPAL / Recuperar Contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-box h2 { margin-top: 0; color: #333; font-size: 1.2em; }
        .login-box h3 { color: #333; margin-bottom: 5px; }
        .step { color: #B30000; font-weight: bold; font-size: 14px; margin-bottom: 15px; display: block;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-enviar { background-color: #B30000; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
        .btn-enviar:hover { background-color: #8B0000; }
        .links { text-align: left; margin-top: 20px; }
        .links a { color: #B30000; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Gestión de Atención Ciudadana</h2>
        <h3>Recuperar contraseña</h3>
        <span class="step">Paso 1 de 3 · Solicitar código</span>
        <p style="color: #666; font-size: 14px;">Ingresa el correo asociado a tu cuenta.</p>
        
        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" name="correo_recuperacion" placeholder="usuario@example.test" required>
            </div>
            <button type="submit" class="btn-enviar">Enviar código</button>
        </form>
        
        <p style="color: #666; font-size: 12px;">Si la cuenta existe, recibirás instrucciones.</p>
        
        <div class="links">
            <a href="{% url 'login' %}">Volver al inicio de sesión</a>
        </div>
    </div>

</body>
</html>
